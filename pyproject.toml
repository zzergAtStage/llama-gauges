[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-gauges"
version = "0.2.0"
description = "Interactive terminal dashboard for llama.cpp llama-server, including the servers LM Studio runs per model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13",
    "psutil>=5.9",
]
keywords = ["llama.cpp", "llama-server", "lm-studio", "tui", "monitoring", "dashboard"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]

[project.scripts]
llama-gauges = "llama_gauges:main"

[tool.setuptools]
py-modules = ["llama_gauges"]
